<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Brandmark</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<nav class="site-nav" id="site-nav"></nav>

<div class="auth-shell">
  <div class="card auth-card">
    <h1 style="font-size:1.6rem; margin:0 0 8px;">Welcome back</h1>
    <p style="color:var(--muted); margin:0 0 28px; font-size:0.9rem;">Sign in to generate, save, and screen names.</p>

    <div class="form-msg" id="form-msg"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
    </form>
    <div class="form-foot">New here? <a href="register.html" style="color:var(--brass);">Create an account</a></div>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  renderNav();
  renderFooter();

  const form = document.getElementById("login-form");
  const msg = document.getElementById("form-msg");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.classList.remove("show", "error");
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";

    try {
      const data = await Api.login({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      });
      Auth.setSession(data);
      window.location.href = data.user.role === "ADMIN" ? "admin.html" : "dashboard.html";
    } catch (err) {
      msg.textContent = err.message;
      msg.classList.add("show", "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
